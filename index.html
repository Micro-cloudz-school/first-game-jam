<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Some game idk</title>
    <link rel="icon" href="icons8-folder-32.png" type="image/x-icon">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <style>
      #normal-popup {
        width: 90vw;
        height: 85vh;
        max-width: 1200px;
        padding: 0;
        border: 2px solid #222;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        z-index: 9999;
      }

      #normal-popup::backdrop {
        background: rgba(0, 0, 0, 0.75);
      }

      #normal-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      #close-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 10;
        background: #ff4444;
        color: white;
        border: none;
        padding: 8px 14px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
      }

      #close-btn:hover {
        background: #cc0000;
      }
    </style>
    
    <script>
      function openGame(url) {
        const popup = document.getElementById('normal-popup');
        const frame = document.getElementById('normal-frame');
        frame.src = url;
        popup.showModal();
      }

      function closeGame() {
        const popup = document.getElementById('normal-popup');
        const frame = document.getElementById('normal-frame');
        popup.close();
        frame.src = "";
      }

      AFRAME.registerComponent('click-listener', {
        schema: {
          url: { type: 'string', default: '' }
        },
        init: function () {
          this.el.addEventListener('click', () => {
            if (this.data.url) {
              openGame(this.data.url);
            }
          });
        }
      });
    </script>
  </head>
  <body>

    <a-assets>
       <a-asset-item id="laptop" src="models/26_11_17_22_42_20_150.glb"></a-asset-item>
       <a-asset-item id="particle-accelerator" src="models/26_11_22_05_06_31_679.glb"></a-asset-item>
    </a-assets>
    
    <dialog id="normal-popup" onclose="closeGame()">
      <button id="close-btn" onclick="closeGame()">X</button>
      <iframe id="normal-frame" src="" allow="autoplay; fullscreen"></iframe>
    </dialog>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <a-sky color="#ECECEC"></a-sky>

      </a-assets> 

       <a-gltf-model 

    src="#laptop" 

    position="-0.122 1.250 0.594" 

    rotation="0 0 0" 

    scale="0.01 0.01 0.01"
         
         class="clickable" click-listener="url: memorychase.html">

  </a-gltf-model>

  <a-gltf-model 

    src="#paticle-accelerator" 

    position="0.122 -1.250 -0.594" 

    rotation="0 0 180" 

    scale="0.01 0.01 0.01"
         
         class="clickable" click-listener="url: memorychase.html">

  </a-gltf-model>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-camera position="0 1.6 0" wasd-controls-enabled="false"></a-camera>
    </a-scene>
  </body>
</html>
